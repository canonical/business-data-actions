name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        type: choice
        required: true
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Releases must be run from main, not ${GITHUB_REF}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest="$(git tag --list --sort=-v:refname \
            | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found = 1 }')"
          if [[ -n "$latest" && "$(git rev-parse "${latest}^{commit}")" == "$GITHUB_SHA" ]]; then
            echo "::error::${GITHUB_SHA} is already released as ${latest}"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major="${major#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="v${major}.${minor}.${patch}"

          git tag "$version" "$GITHUB_SHA"
          git tag --force "v${major}" "$GITHUB_SHA"
          git push --atomic origin "refs/tags/${version}" "+refs/tags/v${major}"
          echo "Released ${version} (${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"
